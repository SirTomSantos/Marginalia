<html lang="en">

<style>
:root{
  --bg:#eceff3; --surface:#fbfbfd; --ink:#1c2333; --muted:#657089; --line:#d9dee7;
  --accent:#3b4cca; --accent-ink:#ffffff; --danger:#b3261e; --card:#f1f3fb;
  --c-yellow:#ffe680; --c-green:#bfe9b0; --c-pink:#ffc6d6; --c-blue:#b9d9ff;
  --u-yellow:#c99700; --u-green:#2e9a4d; --u-pink:#d0366a; --u-blue:#2f6fd6;
  --p-yellow:rgba(255,214,0,.55); --p-green:rgba(80,200,100,.5); --p-pink:rgba(255,95,150,.45); --p-blue:rgba(70,150,255,.45);
  --serif:'Literata',Georgia,'Times New Roman',serif; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151c; --surface:#1a1e28; --ink:#e7eaf2; --muted:#98a2b8; --line:#2b3140;
    --accent:#8c9bff; --accent-ink:#10131c; --danger:#ff8a80; --card:#222838;
    --c-yellow:#6b5a14; --c-green:#2d5a30; --c-pink:#6e2b43; --c-blue:#244a78;
    --u-yellow:#f0c53d; --u-green:#6fd28a; --u-pink:#ff86ad; --u-blue:#78b2ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1e28; --ink:#e7eaf2; --muted:#98a2b8; --line:#2b3140;
  --accent:#8c9bff; --accent-ink:#10131c; --danger:#ff8a80; --card:#222838;
  --c-yellow:#6b5a14; --c-green:#2d5a30; --c-pink:#6e2b43; --c-blue:#244a78;
  --u-yellow:#f0c53d; --u-green:#6fd28a; --u-pink:#ff86ad; --u-blue:#78b2ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 140px}
.wrap.wide{max-width:1000px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:41}
.brand{font-family:var(--serif);font-weight:600;font-size:1.25rem;letter-spacing:-.01em;flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.9rem}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 14px;font-weight:500;font-size:.9rem}
.danger{color:var(--danger)}
.zoom{min-width:44px;text-align:center;color:var(--muted);font-size:.85rem}
input[type=search],input[type=text],textarea{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:.95rem}
textarea{resize:vertical;min-height:90px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lib-actions{margin:16px 0}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.doc h3{margin:0 0 4px;font-family:var(--serif);font-size:1.08rem;font-weight:600}
.doc .meta{color:var(--muted);font-size:.82rem}
.doc .open{all:unset;cursor:pointer;display:block;width:100%}
.hit{margin-top:8px;padding:8px 10px;background:var(--card);border-radius:8px;font-size:.85rem;color:var(--muted)}
.hit b{color:var(--ink);font-weight:500}
.empty{color:var(--muted);text-align:center;padding:36px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}

h1.title{font-family:var(--serif);font-size:1.6rem;line-height:1.2;margin:20px 0 6px;font-weight:600;letter-spacing:-.01em}
.hint{color:var(--muted);font-size:.85rem;margin:0 0 14px}
.notesbtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:500}
.notesbtn .chev{transition:transform .2s}
.notesbtn[aria-expanded=true] .chev{transform:rotate(180deg)}
.notes-list{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;margin-top:-10px;padding:10px 12px 12px}
.note-item{border-left:4px solid var(--line);padding:6px 0 6px 10px;margin:10px 0;cursor:pointer}
.note-item small{color:var(--muted);font-size:.75rem}
.note-item q{display:block;font-family:var(--serif);font-size:.9rem;color:var(--muted);quotes:none;font-style:italic}
.note-item p{margin:4px 0 0;font-size:.92rem;white-space:pre-wrap}
.note-item p.none{color:var(--muted)}

/* text reader */
#text{font-family:var(--serif);font-size:1.1rem;line-height:1.95;white-space:pre-wrap;margin-top:18px;padding:4px 0}
#text span[data-s]{cursor:text;transition:background-color .3s}
#text span.has{cursor:pointer}
.flash{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.marker{display:inline-block;vertical-align:super;font:500 .72rem var(--sans);background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:0 6px;margin-left:3px;line-height:1.5;white-space:normal}
.notecard{display:block;white-space:normal;font-family:var(--sans);font-size:.95rem;line-height:1.5;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px;margin:8px 0 10px;animation:open .18s ease-out}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.notecard{animation:none}}
.notecard textarea{min-height:70px;margin:6px 0}
.notecard .lbl{font-size:.8rem;color:var(--muted)}
.notecard .row{justify-content:space-between}
.swatches{display:flex;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.sel{border-color:var(--ink)}
.sw[data-c=yellow]{background:var(--c-yellow);box-shadow:inset 0 0 0 1px var(--u-yellow)}
.sw[data-c=green]{background:var(--c-green);box-shadow:inset 0 0 0 1px var(--u-green)}
.sw[data-c=pink]{background:var(--c-pink);box-shadow:inset 0 0 0 1px var(--u-pink)}
.sw[data-c=blue]{background:var(--c-blue);box-shadow:inset 0 0 0 1px var(--u-blue)}

/* pdf reader */
#pages{margin-top:16px;overflow-x:auto;padding-bottom:20px}
.page{position:relative;margin:0 auto 14px;background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.12)}
.page .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa1b0;font-size:.85rem}
.page canvas{position:absolute;left:0;top:0;z-index:0}
.textLayer{position:absolute;left:0;top:0;overflow:hidden;line-height:1;z-index:2;-webkit-user-select:text;user-select:text}
.textLayer span{position:absolute;white-space:pre;color:transparent;cursor:text;transform-origin:0 0}
.textLayer ::selection{background:rgba(59,76,202,.35)}
.al,.nl{position:absolute;inset:0;pointer-events:none}
.al{z-index:1}
.nl{z-index:30}
.al .hl{position:absolute;mix-blend-mode:multiply;border-radius:2px}
.al .ul{position:absolute;border-bottom:2px solid}
.al .ci{position:absolute;border:2px solid;border-radius:14px}
.nl .marker{position:absolute;pointer-events:auto;transform:translateY(-60%);vertical-align:baseline;margin:0}
.pcard{position:absolute;pointer-events:auto;width:min(320px,calc(100% - 16px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px;font-size:.92rem;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:open .18s ease-out}
.pcard textarea{min-height:70px;margin:6px 0}
.pcard .lbl{font-size:.8rem;color:var(--muted)}
.pcard .row{justify-content:space-between}
.pcard q{display:block;font-style:italic;color:var(--muted);font-size:.82rem;quotes:none;margin-bottom:2px}

/* notes tab, tags, links */
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tagchip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;color:var(--ink)}
.tagchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.links{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.linkchip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden;max-width:100%}
.linkchip .lk{background:none;border:0;padding:3px 8px;font-size:.78rem;text-align:left;white-space:normal}
.linkchip .x{background:none;border:0;border-left:1px solid var(--line);padding:3px 8px;color:var(--muted)}
.linkchip.back{border-style:dashed}
.small{padding:3px 10px;font-size:.78rem}
.nitem{border-left:4px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin:10px 0;cursor:pointer;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.nitem small{color:var(--muted);font-size:.75rem;display:block}
.nitem q{display:block;font-family:var(--serif);font-style:italic;color:var(--muted);font-size:.9rem;quotes:none;margin:2px 0}
.nitem p{margin:4px 0 0;font-size:.93rem;white-space:pre-wrap}
.picker{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.psheet{background:var(--bg);width:100%;max-width:720px;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.psheet .row{justify-content:space-between;margin-bottom:10px}
.toc-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 4px;font-size:.95rem}
.toc-item.cur{color:var(--accent);font-weight:600}

/* epub */
#chap{font-family:var(--serif);font-size:1.1rem;line-height:1.85;margin-top:16px;overflow-wrap:anywhere}
#chap h1,#chap h2,#chap h3,#chap h4{font-family:var(--serif);line-height:1.25;margin:1.4em 0 .5em}
#chap p{margin:0 0 1em}
#chap img{max-width:100%;height:auto;display:block;margin:12px auto}
#chap blockquote{margin:1em 0;padding-left:14px;border-left:3px solid var(--line);color:var(--muted)}
#chap table{border-collapse:collapse;display:block;overflow-x:auto}
#chap td,#chap th{border:1px solid var(--line);padding:4px 8px}
#chap a{color:var(--accent)}
#chap span[data-ids]{cursor:pointer}
.chapnav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:20px 0}
.chapnav span{color:var(--muted);font-size:.82rem;text-align:center;flex:1}

/* drawing */
.ic{position:absolute;inset:0;z-index:35;touch-action:none;display:none;cursor:crosshair}
body.drawing .ic{display:block}
body.drawing .ic.penonly{touch-action:pan-y pinch-zoom}
.inksvg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
#inkbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.12)}
#inkbar.on{display:block}
#inkbar .inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ink-sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.ink-sw.sel{border-color:var(--ink)}
.sizebtn{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:34px;display:flex;align-items:center;justify-content:center}
.sizebtn.sel{border-color:var(--accent);background:var(--card)}
.sizebtn i{display:block;background:var(--ink);border-radius:999px;width:20px}

/* groups */
.gbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.srchead{margin:18px 0 6px;font-family:var(--serif);font-size:1rem;font-weight:600}
.ghost.sel{border-color:var(--accent);color:var(--accent)}

/* sync status */
.syncst{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 0;font-size:.82rem;color:var(--muted)}
.syncst .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.syncst.ok .dot{background:#2e9a4d}
.syncst.syncing .dot{background:var(--accent)}
.syncst.error .dot{background:var(--danger)}
.syncst button{padding:3px 10px;font-size:.78rem}

/* toolbar */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.12)}
#bar.on{display:block}
#bar .inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:9px 6px;font-size:.88rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button.sel{background:var(--accent);color:var(--accent-ink)}
#bar .row{justify-content:space-between;flex-wrap:nowrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:90vw;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.88rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>

<body>
<div class="wrap" id="app"></div>
<div id="bar" role="toolbar" aria-label="Mark selected text"></div>
<div id="inkbar" role="toolbar" aria-label="Drawing tools"></div>
<div id="toast" role="status"></div>

<script>
(function(){
const KEY='marginalia:v1';
const COLORS=['yellow','green','pink','blue'];
const WORKER='lib/pdf.worker.min.js';
const SAMPLE_TEXT=`Why rereading feels like learning but often isn't

Most students study by reading a chapter again and again. It feels productive because the words become familiar, and familiarity is easy to mistake for understanding. Recognising a sentence on the page is a much weaker skill than producing the idea from memory with the page closed.

Psychologists call the stronger approach retrieval practice. Instead of looking at the material, you close it and try to write down or say what you remember. The effort is uncomfortable, and that discomfort is the point: each successful recall strengthens the memory and each failure shows you exactly where the gap is.

Timing matters as much as method. Spacing your study sessions over days rather than cramming into one evening gives memories time to fade just enough that retrieving them takes real work. That slight difficulty is what makes the memory last. Cramming produces confident students on Thursday and blank ones the following week.

Annotation can support all of this, but only if it is active. Highlighting an entire page turns the text yellow without turning it into knowledge. A better habit is to mark a single sentence, then write in your own words what it means, why it matters, and how it connects to something you already know.

Notes are most useful when they are written for your future self. Imagine returning in three months with no memory of the chapter. A short breakdown beside the key sentence, plus a question you still have, lets you rebuild the argument in minutes instead of rereading everything.`;

let S;
let view='library', q='', panelOpen=false, openNotes=new Set(), pending=null, mode='highlight', color='yellow', adding=false, barBusy=false;
let P=null, zoom=1, renderToken=0; const pdfCache={}; const dirty=new Set(), dlFailed=new Set();
let libTab='library', tagFilter=null, nq='', pendingJump=null, E=null, openGroup=null, ctxGroup=null, uploadGroup=null;
const draw={on:false,tool:'pen',size:2,color:'blue',penOnly:false,stack:[]};
const INK={black:'#1b1f2a',blue:'#2f6fd6',red:'#d93a3a',green:'#2e9a4d'};
const INKW={1:.0016,2:.003,3:.0065};
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
function seed(){return{docs:[{id:'sample0',kind:'text',title:'Sample: Why rereading feels like learning',text:SAMPLE_TEXT,words:SAMPLE_TEXT.split(/\s+/).length,added:Date.now(),noSync:true}],annos:[],cur:null,dels:[]}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function el(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}kids.flat().forEach(k=>{if(k!=null)e.append(k.nodeType?k:document.createTextNode(k))});return e}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),m.length>40?4500:1800)}
const doc=()=>S.docs.find(d=>d.id===S.cur);
const annosOf=id=>S.annos.filter(a=>a.doc===id&&a.start!=null&&!a.del).sort((a,b)=>a.start-b.start);
const twoCol={};
const colOf=a=>{if(!twoCol[a.doc+':'+a.page])return 0;const r=a.rects[0];if(r.w>.65)return 0;return r.x+r.w/2>=.5?1:0};
const pdfAnnos=id=>S.annos.filter(a=>a.doc===id&&a.page&&!a.del&&a.type!=='ink').sort((a,b)=>a.page-b.page||colOf(a)-colOf(b)||a.rects[0].y-b.rects[0].y||a.rects[0].x-b.rects[0].x);
function detectTwoCol(tc,W){
  const mid=W/2,gut=W*.03;let l=0,r=0,c=0;
  tc.items.forEach(it=>{
    if(!it.str||!it.str.trim())return;
    const x=it.transform[4],e=x+it.width;
    if(x<mid-gut&&e>mid+gut)c++;else if(e<=mid+gut)l++;else r++;
  });
  const total=l+r+c;
  return l>=12&&r>=12&&c<=total*.02;
}
async function ensureCols(id){
  if(!P)return;
  const pages=[...new Set(S.annos.filter(a=>a.doc===id&&a.page&&!a.del).map(a=>a.page))];
  for(const n of pages){
    const k=id+':'+n;if(k in twoCol)continue;twoCol[k]=false;
    try{twoCol[k]=detectTwoCol(await P.proxies[n-1].getTextContent(),P.vp1[n-1].width)}catch(e){}
  }
}
const epubAnnos=id=>S.annos.filter(a=>a.doc===id&&a.ch!=null&&!a.del).sort((a,b)=>a.ch-b.ch||a.start-b.start);
const allAnnos=d=>d.kind==='pdf'?pdfAnnos(d.id):d.kind==='epub'?epubAnnos(d.id):annosOf(d.id);
const snippet=(d,a,n=90)=>{const raw=a.text!=null?a.text:(d&&d.text?d.text.slice(a.start,a.end):'');const t=raw.replace(/\s+/g,' ');return t.length>n?t.slice(0,n)+'…':t};
const hasNote=a=>a.note&&a.note.trim();

/* ---------- IndexedDB for PDF files ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('marginalia',2);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('pdfs'))db.createObjectStore('pdfs');if(!db.objectStoreNames.contains('cloud'))db.createObjectStore('cloud')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('pdfs','readwrite');t.objectStore('pdfs').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('pdfs','readonly').objectStore('pdfs').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}
async function idbDel(k){try{const db=await idb();db.transaction('pdfs','readwrite').objectStore('pdfs').delete(k)}catch(e){}}

/* ---------- Library ---------- */
function renderLibrary(){
  hideBar();releasePdf();

async function importFile(f){

      if(!window.pdfjsLib){toast('The PDF reader did not load. Check your connection and reload the page.');return}
      toast('Opening PDF…');
      const buf=await f.arrayBuffer();
      const pdf=await loadPdf(buf);
      let index='';
      for(let p=1;p<=Math.min(pdf.numPages,60)&&index.length<80000;p++){
        const tc=await (await pdf.getPage(p)).getTextContent();
        index+=tc.items.map(i=>i.str).join(' ')+'\n';
      }
      const id=uid();pdfCache[id]=buf;
      let stored=true;try{await idbPut(id,buf)}catch(e){stored=false}
      S.docs.unshift({id,kind:'pdf',title:name,pages:pdf.numPages,index:index.slice(0,60000),text:'',groups:uploadGroup?[uploadGroup]:[],added:Date.now(),u:Date.now()});
      save();try{pdf.destroy()}catch(e){}syncSoon(500,true);
      openDoc(id,uploadGroup);

    }else if(/\.epub$/i.test(f.name)||f.type==='application/epub+zip'){await importEpub(f)}

}

async function importBackup(f){

function setZoom(z){

  let keep=1;P.pages.forEach(pg=>{if(pg.el.getBoundingClientRect().bottom>90&&keep===1&&pg.n>=1){keep=pg.n;}});
  const first=P.pages.find(pg=>pg.el.getBoundingClientRect().bottom>90);if(first)keep=first.n;
  zoom=z;$('#zl').textContent=Math.round(zoom*100)+'%';

function buildPages(){
  if(P.io)P.io.disconnect();

  P.pages=P.proxies.map((proxy,i)=>{
    const vp1=P.vp1[i],w=Math.round(baseW*zoom),h=Math.round(w*vp1.height/vp1.width);
    const pe=el('div',{class:'page','data-n':i+1,style:`width:${w}px;height:${h}px`},
      el('div',{class:'ph',text:'Page '+(i+1)}),el('div',{class:'al'}),el('div',{class:'nl'}),el('div',{class:'ic'}));

const MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp'};
const normPath=p=>{const out=[];p.split('/').forEach(s=>{if(s==='..')out.pop();else if(s&&s!=='.')out.push(s)});return out.join('/')};
const dirOf=p=>p.includes('/')?p.slice(0,p.lastIndexOf('/')+1):'';

const BAD='script,style,link,meta,iframe,object,embed,form,input,button,select,textarea,audio,video,source,base,noscript,canvas,template,svg,math';

  root.querySelectorAll('*').forEach(n=>{
    [...n.attributes].forEach(at=>{if(!KEEP_ATTR.includes(at.name.toLowerCase()))n.removeAttribute(at.name)});
    const tag=n.tagName.toLowerCase();
    if(tag==='a'){
      const h=n.getAttribute('href');if(h==null)return;
      const nh=linkFn(h);

      else{n.setAttribute('href',nh);if(/^https?:/i.test(nh)){n.setAttribute('target','_blank');n.setAttribute('rel','noopener noreferrer')}}
    }else if(tag==='img'){
      if(!/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(n.getAttribute('src')||''))n.remove();
    }else{n.removeAttribute('href');n.removeAttribute('src')}

}
const mkLink=(ci,chapPath,idxOf)=>h=>{

  if(h.startsWith('#'))return '#ch/'+ci+'/'+encodeURIComponent(h.slice(1));
  if(/^[a-z][a-z0-9+.-]*:/i.test(h))return null;

async function inlineImages(body,zip,chapPath){
  for(const svg of [...body.querySelectorAll('svg')]){
    const im=svg.querySelector('image');
    if(im){const img=document.createElement('img');img.setAttribute('src',im.getAttribute('xlink:href')||im.getAttribute('href')||'');svg.replaceWith(img)}
    else svg.remove();
  }

    const src=img.getAttribute('src')||'';
    if(!src||/^(https?:|data:)/i.test(src)){if(!/^data:image\//i.test(src))img.remove();continue}
    const path=pathOf(dirOf(chapPath)+src.split('#')[0]);
    const f=zip.file(path);if(!f){img.remove();continue}
    const mime=MIME[path.split('.').pop().toLowerCase()];
    if(!mime){img.remove();continue}
    const b=await f.async('base64');

function groupMarkdown(gid){
  const g=groupById(gid);if(!g)return '';
  const out=[`# ${g.name}`,''],tagMap={};
  const ref=a=>{const d=docOf(a.doc),w=where(a);return (d?d.title:'')+(w?' ['+w+']':'')};
  groupDocs(gid).forEach(d=>{
    const ns=allAnnos(d).filter(hasNote);if(!ns.length)return;
    out.push(`## ${d.title}${d.author?' — '+d.author:''}`,'');
    ns.forEach(a=>{
      const w=where(a);
      out.push(`- ${w?'['+w+'] ':''}“${snippet(d,a,400)}”`,'  '+a.note.replace(/\n/g,'\n  '));
      const rel=(a.links||[]).map(annoById).filter(Boolean).map(ref);
      if(rel.length)out.push('  Related: '+rel.join('; '));
      out.push('');
      tagsOf(a).forEach(t=>{(tagMap[t]=tagMap[t]||[]).push(a)});
    });
  });
  const tags=Object.keys(tagMap).sort();
  if(tags.length){
    out.push('## Notes by tag','');
    tags.forEach(t=>{out.push(`### ${t}`,'');tagMap[t].forEach(a=>out.push(`- ${a.note.replace(/\s+/g,' ').slice(0,200)} — ${ref(a)}`));out.push('')});
  }
  return out.join('\n');
}

const GAPI='https://www.googleapis.com/drive/v3',GUP='https://www.googleapis.com/upload/drive/v3',GIS_URL='https://accounts.google.com/gsi/client';

const nap=ms=>new Promise(r=>setTimeout(r,ms));

async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=items[i++];await fn(k)}}))}
async function cloudAll(){const db=await idb();return new Promise((res,rej)=>{const out={},q=db.transaction('cloud','readonly').objectStore('cloud').openCursor();q.onsuccess=()=>{const c=q.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};q.onerror=()=>rej(q.error)})}

function loadGIS(){

function driveConnect(interactive){

async function gfetch(url,opts,again){
  opts=opts||{};
  if(DRIVE.tok&&Date.now()>DRIVE.exp-60000&&Date.now()-DRIVE.lastTry>30000){DRIVE.lastTry=Date.now();try{await driveConnect(false)}catch(e){}}
  if(!DRIVE.tok||Date.now()>DRIVE.exp){DRIVE.tok=null;sync.needAuth=true;paintSync();throw gerr('auth','Signed out')}
  const r=await fetch(url,Object.assign({},opts,{headers:Object.assign({},opts.headers||{},{Authorization:'Bearer '+DRIVE.tok})}));
  if(r.status===401){DRIVE.tok=null;sync.needAuth=true;paintSync();throw gerr('auth','Signed out')}
  if((r.status===429||r.status>=500)&&!again){await nap(900+Math.random()*900);return gfetch(url,opts,true)}
  if(!r.ok){
    let reason='';try{const j=await r.clone().json();reason=(((j.error||{}).errors||[{}])[0]||{}).reason||''}catch(e){}
    throw gerr(r.status===403&&/quota/i.test(reason)?'quota_exceeded':(r.status===403||r.status===429)?'rate_limited':'drive_'+r.status,'Drive '+r.status+(reason?' '+reason:''));
  }
  return r;
}
async function driveListAll(){

function multipart(meta,blob){

  return{boundary,blob:new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: ${blob.type||'application/octet-stream'}\r\n\r\n`,blob,`\r\n--${boundary}--`])};
}

  const b=multipart(meta,new Blob([JSON.stringify(obj)],{type:'application/json'}));
  const url=(id?`${GUP}/files/${id}`:`${GUP}/files`)+'?uploadType=multipart&fields=id,modifiedTime';

const driveCol={
  limit(){return driveCol},
  async get(){

    dups.forEach(f=>gfetch(GAPI+'/files/'+f.id,{method:'DELETE'}).catch(()=>{}));

    await pool(need,6,async k=>{
      try{const content=await (await gfetch(GAPI+'/files/'+best[k].id+'?alt=media')).json();cache[k]={id:best[k].id,mt:best[k].modifiedTime,content};await cloudPut(k,cache[k]).catch(()=>{})}

      let c=cache[name];
      if(!c||c.mt!==m.modifiedTime||c.id!==m.id){
        const content=await (await gfetch(GAPI+'/files/'+m.id+'?alt=media')).json();
        c=cache[name]={id:m.id,mt:m.modifiedTime,content};await cloudPut(name,c).catch(()=>{});
      }
      return{id:name,exists:true,data:()=>cl(c.content)};
    },
    async set(obj){await driveWriteJson(name,obj)},
    async delete(){
      const id=DRIVE.idx[name]||((await driveMeta(name))||{}).id;
      if(id){try{await gfetch(GAPI+'/files/'+id,{method:'DELETE'})}catch(e){if(!e||e.code!=='drive_404')throw e}}
      delete DRIVE.idx[name];const cache=await cloudCache();delete cache[name];await cloudDel(name).catch(()=>{});
    }
  }}
};
const driveAssets={
  async upload(blob){
    const type=blob.type||'application/octet-stream',name='f_'+uid()+uid();let id;
    if(blob.size>GCFG.resumableOver){
      const init=await gfetch(`${GUP}/files?uploadType=resumable&fields=id`,{method:'POST',headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':type,'X-Upload-Content-Length':String(blob.size)},body:JSON.stringify({name,parents:['appDataFolder']})});
      const loc=init.headers.get('Location');if(!loc)throw gerr('upload_failed','No upload session');
      const put=await fetch(loc,{method:'PUT',headers:{'Content-Type':type},body:blob});
      if(!put.ok)throw gerr('drive_'+put.status,'Upload failed '+put.status);
      id=(await put.json()).id;
    }else{
      const b=multipart({name,parents:['appDataFolder']},blob);
      id=(await (await gfetch(`${GUP}/files?uploadType=multipart&fields=id`,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b.boundary},body:b.blob})).json()).id;
    }
    return{id,url:'',sizeBytes:blob.size,contentType:type};
  },
  async delete(id){try{await gfetch(`${GAPI}/files/${id}`,{method:'DELETE'})}catch(e){if(e&&e.code==='drive_404')return{deleted:false};throw e}return{deleted:true}},
  async list(){
    const q=((await (await gfetch(`${GAPI}/about?fields=storageQuota`)).json()).storageQuota)||{};
    return{assets:[],usage:{files:0,bytes:+(q.usage||0),maxBytes:+(q.limit||0),maxFiles:0}};
  }
};
function syncSoon(ms,full){
  if(!sync.col)return;
  if(full)sync.wantFull=true;
  clearTimeout(sync.timer);
  sync.timer=setTimeout(()=>{const f=sync.wantFull;sync.wantFull=false;runSync(f)},ms);
}
async function fetchAsset(id){return await (await gfetch(`${GAPI}/files/${id}?alt=media`)).arrayBuffer()}
function removeLocalDoc(id){
  S.docs=S.docs.filter(x=>x.id!==id);S.annos=S.annos.filter(a=>a.doc!==id);
  delete pdfCache[id];idbDel(id);if(S.cur===id)S.cur=null;
}
function deleteDoc(id){
  const d=S.docs.find(x=>x.id===id);
  if(d&&!d.noSync)S.dels.push({id,asset:d.asset||null});
  removeLocalDoc(id);save();syncSoon(300,true);
}
function fromRemote(rd,id){
  return{id,kind:rd.kind||'text',title:rd.title||'Untitled',author:rd.author||'',groups:Array.isArray(rd.groups)?[...rd.groups]:[],toc:Array.isArray(rd.toc)?[...rd.toc]:[],pages:rd.pages||null,words:rd.words||0,index:rd.index||'',text:'',asset:rd.asset||null,tooBig:!!rd.tooBig,added:rd.added||Date.now(),u:rd.u||0,synced:true};
}
async function putDoc(d){
  const isPdf=d.kind==='pdf';
  const words=d.words||(d.text?d.text.split(/\s+/).length:0);
  const index=((isPdf||d.kind==='epub')?(d.index||''):(d.index||d.text||'')).slice(0,60000);
  await sync.col.doc('d_'+d.id).set({kind:d.kind==='epub'?'epub':isPdf?'pdf':'text',title:d.title,author:d.author||'',groups:(d.groups||[]),toc:(d.toc||[]).slice(0,600).map(x=>String(x).slice(0,80)),pages:d.pages||null,words,index,asset:d.asset||null,tooBig:!!d.tooBig,added:d.added||Date.now(),u:d.u||Date.now()});
  d.synced=true;
}
async function uploadDoc(d){
  if(!sync.assets)return false;
  let blob;
  if(d.kind==='pdf'||d.kind==='epub'){const b=await getPdfBuf(d.id);if(!b)return false;blob=new Blob([b],{type:d.kind==='pdf'?'application/pdf':'application/json'})}
  else{if(!d.text)return false;if(!d.kind)d.kind='text';blob=new Blob([d.text],{type:'text/plain'})}
  if(!d.u)d.u=Date.now();
  if(blob.size>MAXB){d.tooBig=true;d.asset=null}
  else{
    try{const r=await sync.assets.upload(blob);d.asset=r.id;d.tooBig=false}
    catch(e){if(e&&e.code==='too_large'){d.tooBig=true;d.asset=null}else throw e}
  }
  await putDoc(d);save();return true;
}
async function pushDeletes(){
  for(const x of [...S.dels]){
    await sync.col.doc('d_'+x.id).set({deleted:true,u:Date.now()});
    try{await sync.col.doc('m_'+x.id).delete()}catch(e){}
    try{await sync.col.doc('k_'+x.id).delete()}catch(e){}
    if(x.asset&&sync.assets){try{await sync.assets.delete(x.asset)}catch(e){}}
    S.dels=S.dels.filter(y=>y.id!==x.id);save();
  }
}
async function syncMarks(id,rm,pre,ink){
  pre=pre||'m';ink=!!ink;
  const mine=a=>a.doc===id&&(a.type==='ink')===ink;
  const now=Date.now();
  const local=S.annos.filter(mine);
  local.forEach(a=>{if(!a.u)a.u=now});
  const remoteList=rm&&rm.annos?cl(rm.annos):[];
  const map=new Map();
  remoteList.forEach(a=>map.set(a.id,a));
  local.forEach(a=>{const r=map.get(a.id);if(!r||a.u>(r.u||0))map.set(a.id,a)});
  const cutoff=now-30*864e5;
  let merged=[...map.values()].filter(a=>!(a.del&&a.u<cutoff));
  const canon=l=>stable(l.slice().sort((x,y)=>x.id<y.id?-1:x.id>y.id?1:0));
  const cm=canon(merged);
  let changedLocal=false;
  if(cm!==canon(local)){S.annos=S.annos.filter(a=>!mine(a)).concat(merged);changedLocal=true}
  if(cm!==canon(remoteList)){
    if(JSON.stringify(merged).length>230000)merged=merged.filter(a=>!a.del);
    if(JSON.stringify(merged).length>230000){const err=new Error('too many marks');err.code='marks_too_big';throw err}
    await sync.col.doc(pre+'_'+id).set({annos:merged,u:now});
  }
  return changedLocal;
}
async function fullPass(changedDocs){
  const snap=await sync.col.limit(1000).get();
  const remote={};snap.docs.forEach(s=>{if(s.exists)remote[s.id]=s.data()});
  let structural=false;
  for(const k of Object.keys(remote)){
    if(!k.startsWith('g_'))continue;
    const id=k.slice(2),rg=remote[k],lg=S.groups.find(x=>x.id===id);
    if(!lg){S.groups.push({id,name:rg.name||'Group',u:rg.u||0,del:!!rg.deleted});structural=true}
    else if((rg.u||0)>(lg.u||0)){lg.name=rg.name||lg.name;lg.u=rg.u;lg.del=!!rg.deleted;structural=true}
    else if((lg.u||0)>(rg.u||0))await putGroup(lg);
  }
  for(const lg of S.groups){if(!remote['g_'+lg.id])await putGroup(lg)}
  const pend=new Set(S.dels.map(x=>x.id));
  for(const k of Object.keys(remote)){
    if(!k.startsWith('d_'))continue;
    const id=k.slice(2),rd=remote[k],ld=S.docs.find(x=>x.id===id);
    if(pend.has(id))continue;
    if(rd.deleted){if(ld){removeLocalDoc(id);structural=true}continue}
    if(!ld){S.docs.push(fromRemote(rd,id));structural=true}
    else{
      if((rd.u||0)>(ld.u||0)){ld.title=rd.title;ld.u=rd.u;ld.groups=Array.isArray(rd.groups)?[...rd.groups]:[];structural=true}
      else if((ld.u||0)>(rd.u||0))await putDoc(ld);
      if(!ld.asset&&rd.asset){ld.asset=rd.asset;ld.tooBig=!!rd.tooBig}
      ld.synced=true;
    }
  }
  const ready=[];
  for(const d of [...S.docs]){
    if(d.noSync)continue;
    const rd=remote['d_'+d.id];
    if(rd&&!rd.deleted){ready.push(d.id);continue}
    if(!rd&&await uploadDoc(d)){ready.push(d.id);structural=true}
  }
  for(const id of ready){
    if(await syncMarks(id,remote['m_'+id],'m',false))changedDocs.add(id);
    if(await syncMarks(id,remote['k_'+id],'k',true))changedDocs.add(id);
  }
  if(sync.assets){try{sync.usage=(await sync.assets.list()).usage}catch(e){}}
  return structural;
}
async function quickPass(changedDocs){
  const ids=[...dirty];dirty.clear();
  let needFull=false;
  try{
    for(const id of ids){
      const d=S.docs.find(x=>x.id===id);
      if(!d||d.noSync)continue;
      if(!d.synced){needFull=true;continue}
      const snap=await sync.col.doc('m_'+id).get();
      if(await syncMarks(id,snap.exists?snap.data():null,'m',false))changedDocs.add(id);
      if(S.annos.some(a=>a.doc===id&&a.type==='ink')){const ks=await sync.col.doc('k_'+id).get();if(await syncMarks(id,ks.exists?ks.data():null,'k',true))changedDocs.add(id)}
    }
  }catch(e){ids.forEach(i=>dirty.add(i));throw e}
  if(needFull)sync.wantFull=true;
  return false;
}
async function runSync(full){
  if(!sync.col)return;
  if(sync.running){sync.again=true;sync.againFull=sync.againFull||full;return}
  sync.running=true;setSync('syncing','Syncing…');
  const changedDocs=new Set();let structural=false,failed=false;
  try{
    await pushDeletes();
    structural=full?await fullPass(changedDocs):await quickPass(changedDocs);
    save();
    sync.last=Date.now();
    const t=new Date(sync.last).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
    setSync('ok','Synced '+t+(sync.usage?` · Google Drive ${fmtSize(sync.usage.bytes)}${sync.usage.maxBytes?' of '+fmtSize(sync.usage.maxBytes):''} used`:''));
  }catch(e){
    failed=true;
    const c=e&&e.code;
    setSync('error',c==='quota_exceeded'||c==='quota_or_state'?'Your Google Drive is full. Free up space and tap Sync now.':c==='marks_too_big'?'One item has too many marks or drawings to sync.':c==='resource_exhausted'||c==='rate_limited'?'Sync paused (too many requests). Retrying shortly.':c==='auth'?'Google sign-in expired. Tap Reconnect.':c==='revoked'?'Cloud access changed. Reload the page.':'Could not sync ('+(c||(e&&e.message)||'error')+'). Retrying shortly.');
    if(c!=='revoked'&&c!=='auth')syncSoon(120000,true);
  }finally{sync.running=false}
  if(!failed)refreshAfterSync(changedDocs,structural);
  if(sync.again){const f=sync.againFull;sync.again=false;sync.againFull=false;syncSoon(300,f)}
  else if(sync.wantFull&&!failed)syncSoon(300,true);
}
function refreshAfterSync(changedDocs,structural){
  if(view==='library'){if($('#list')){libTab==='notes'?renderNotesTab():libTab==='groups'?(openGroup?fillGroupBody():fillGroupsHome()):renderList()}return}
  if(view!=='reader')return;
  if(!doc()){view='library';hideBar();renderLibrary();return}
  if(changedDocs.has(S.cur)){
    const typing=document.activeElement&&document.activeElement.tagName==='TEXTAREA';
    if(typing)return;
    if(P){P.pages.forEach(pg=>renderAnnos(pg.n));renderPdfNotes()}
    else if(E){rerenderChapter();renderEpubNotes()}
    else renderReader();
  }
}

/* ---------- Selection toolbar ---------- */
function readSelection(){
  if(view!=='reader'||!doc())return null;
  const k=doc().kind;return k==='pdf'?readPdfSelection():k==='epub'?readEpubSelection():readTextSelection();
}
document.addEventListener('selectionchange',()=>{
  const p=readSelection();
  if(p){pending=p;showBar()}
  else if(!barBusy){pending=null;hideBar()}
});
function showBar(){
  const bar=$('#bar');bar.replaceChildren();
  const seg=el('div',{class:'seg'},[['highlight','Highlight'],['underline','Underline'],['circle','Circle']].map(([k,l])=>el('button',{class:mode===k?'sel':'',text:l,onclick:()=>{mode=k;showBar()}})));
  const sw=el('div',{class:'swatches'},COLORS.map(c=>el('button',{class:'sw'+(color===c?' sel':''),'data-c':c,'aria-label':'Mark '+c,onclick:()=>{color=c;apply(false)}})));
  const noteBtn=el('button',{class:'primary',text:'Add note',onclick:()=>apply(true)});
  bar.append(el('div',{class:'inner'},seg,el('div',{class:'row'},sw,noteBtn)));
  bar.querySelectorAll('button').forEach(b=>{b.addEventListener('pointerdown',e=>{barBusy=true;e.preventDefault()});b.addEventListener('pointerup',()=>setTimeout(()=>barBusy=false,300))});
  bar.classList.add('on');
}
function hideBar(){$('#bar').classList.remove('on')}
function apply(withNote){
  if(!pending)return;
  if(doc().kind==='pdf')return applyPdf(withNote);
  if(doc().kind==='epub')return applyEpub(withNote);
  const a={id:uid(),doc:S.cur,start:pending.start,end:pending.end,type:mode,color,note:'',u:Date.now()};
  S.annos.push(a);save();markDirty(S.cur);
  if(withNote)openNotes.add(a.id);
  pending=null;barBusy=false;
  const sel=getSelection();if(sel)sel.removeAllRanges();
  hideBar();renderReader();
  if(withNote){const c=document.getElementById('nc-'+a.id);if(c){c.scrollIntoView({block:'center'});const t=c.querySelector('textarea');if(t)t.focus({preventScroll:true})}}
}

S=load()||seed();S.dels=S.dels||[];S.groups=S.groups||[];
renderLibrary();
syncInit();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sync.col)syncSoon(500,true)});
})();
</script>
